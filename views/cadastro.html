<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-MVC-JWT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Cadastro</h1>
        <form id="cadastroForm">     
            <input type="text" id="usuarioI" placeholder="Usuário">
            <br>
            <input type="email" id="emailI" placeholder="E-mail">
            <br>
            <input type="password" id="senhaI" placeholder="Senha">
            <br>
            <input type="password" id="confirmarSenhaI" placeholder="Confirmar Senha">
            <p id="error"></p>

            <button>Login</button>
        </form>
        <a href="login.html">Entrar</a>
    </div>

    <script src="js/script_cadastro.js"></script>
</body>
</html>
